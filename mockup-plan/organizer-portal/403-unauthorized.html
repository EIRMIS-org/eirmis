<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Unauthorized</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/eirmis.css">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --primary-glow: rgba(79, 70, 229, 0.15);
      --secondary: #0D9488;
      --secondary-light: #F0FDFA;
      --dark: #0F172A;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-glass: rgba(255, 255, 255, 0.85);
      --border: rgba(226, 232, 240, 0.8);
      --border-focus: #818CF8;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;
      --success: #15803D;
      --success-bg: #DCFCE7;
      --success-border: #86EFAC;
      --warning: #B45309;
      --warning-bg: #FEF3C7;
      --warning-border: #FDE68A;
      --error: #B91C1C;
      --error-bg: #FEE2E2;
      --error-border: #FECACA;
      --font-display: 'Hanken Grotesk', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
      --shadow-card: 0 4px 12px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02);
      --shadow-float: 0 12px 28px -6px rgba(15, 23, 42, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body); background-color: var(--bg); color: var(--text-main);
      font-size: 13.5px; line-height: 1.5; display: flex; height: 100vh; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    aside {
      width: 250px; background: var(--surface-glass); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 30; transition: width 0.3s var(--ease-spring);
    }
    .sidebar-header { padding: 22px 20px 18px 20px; display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 38px; height: 38px; background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); flex-shrink: 0; }
    .brand-meta h1 { font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); line-height: 1.1; }
    .brand-meta span { font-size: 11px; font-weight: 600; color: var(--primary); letter-spacing: 0.02em; text-transform: uppercase; }
    
    .nav-list { flex: 1; padding: 4px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
    .nav-btn { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-radius: var(--radius-md); color: #475569; background: transparent; border: none; font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; transition: all 0.18s var(--ease-spring); width: 100%; user-select: none; }
    .nav-btn:hover { background: rgba(241, 245, 249, 0.8); color: var(--text-main); }
    .nav-btn.active { background: var(--primary); color: #FFFFFF; font-weight: 600; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); }
    .nav-btn.active svg { stroke: #FFFFFF; }
    
    main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background-color: var(--bg); position: relative; }
    
    .topbar { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .user-pill { display: flex; align-items: center; gap: 10px; padding: 4px 10px 4px 4px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: all 0.15s; }
    .user-pill:hover { background: #F1F5F9; border-color: #CBD5E1; }
    .user-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; }
    
    .content-area { padding: 28px 32px 64px 32px; max-width: 1320px; width: 100%; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: center; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px; box-shadow: var(--shadow-subtle); display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 460px; width: 100%; }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: all 0.15s var(--ease-spring); font-family: var(--font-body); user-select: none; }
    .btn-primary { background: var(--primary); color: #FFFFFF; }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px var(--primary-glow); }

    .error-icon { color: var(--error); margin-bottom: 24px; background: var(--error-bg); width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 6px solid #FEF2F2; }
    
    .error-heading { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 12px; }
    .error-text { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-header">
      <div class="brand-mark">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div class="brand-meta">
        <h1>EIRMIS</h1>
        <span>Organizer Portal</span>
      </div>
    </div>

    <nav class="nav-list">
      <button class="nav-btn active">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Events
      </button>
    </nav>
  </aside>

  <main>
    <header class="topbar">
      <div></div>
      <div class="topbar-right">
        <div class="user-pill">
          <div class="user-avatar">SJ</div>
          <span style="font-weight:600; font-size:12.5px;">Sarah Jenkins</span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted); margin-left:4px;">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </header>

    <div class="content-area">
      <div class="card">
        <div class="error-icon">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2 class="error-heading">403: Access Denied</h2>
        <p class="error-text">You do not have the required Organizer permissions to view or manage guest lists. If you believe this is an error, please contact the event administrator.</p>
        <a href="organizer-portal.html" class="btn btn-primary">Return to Events List</a>
      </div>
    </div>
  </main>

</body>
</html>
