WaitlistPromoteRequest:
  type: object
  description: >
    Request body for the `promoteWaitlist` Edge Function (callable by the event's organizer
    or with the service-role key; the underlying database RPC is restricted to service-role).
    Promotes the next `waitlisted` invitation(s) for an event in strict FIFO order
    (keyed by `waitlisted_at`) while enforcing event capacity atomically. Promotion reserves
    one seat for the primary attendee; any additional attendees already submitted remain
    `pending` and still require organizer review.
  example:
    event_id: 55555555-5555-5555-5555-555555555555
    max_promotions: 1
  required: [event_id]
  properties:
    event_id:
      type: string
      format: uuid
      description: The event whose waitlist should be promoted.
      example: 55555555-5555-5555-5555-555555555555
    max_promotions:
      type: integer
      minimum: 1
      description: Maximum number of invitations to promote in this run. Defaults to 1.
      example: 1

WaitlistPromoteResponse:
  type: object
  description: Response from the `promoteWaitlist` Edge Function.
  example:
    promoted_count: 1
    promoted_invitation_ids:
      - 66666666-6666-6666-6666-666666666666
  required: [promoted_count]
  properties:
    promoted_count:
      type: integer
      description: Number of invitations promoted from `waitlisted` to `accepted`.
      example: 1
    promoted_invitation_ids:
      type: array
      items:
        type: string
        format: uuid
      description: UUIDs of invitations promoted to accepted status.
      example:
        - 66666666-6666-6666-6666-666666666666
