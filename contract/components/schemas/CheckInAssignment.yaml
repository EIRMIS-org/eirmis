CheckInAssignment:
  type: object
  description: >
    A per-event delegation of check-in access to a named staff member.
    Access is tightly constrained: the staff member may only scan/search attendees
    for the single assigned event while `status = active`. Revoking the assignment
    immediately blocks further check-in.
  required:
    - id
    - event_id
    - staff_email
    - invited_by
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
      example: 88888888-8888-8888-8888-888888888888
    event_id:
      type: string
      format: uuid
      example: 55555555-5555-5555-5555-555555555555
    staff_email:
      type: string
      format: email
      description: >
        The email address the invitation magic-link is sent to.
        UNIQUE(event_id, staff_email) is enforced.
      example: staff@example.com
    auth_user_id:
      type: ['string', 'null']
      format: uuid
      description: >
        FK to `auth.users.id`. `null` until the staff member completes their
        first magic-link login. Set by a DB trigger — same lazy-linkage pattern
        as `guests.auth_user_id`.
      example: 44444444-4444-4444-4444-444444444444
    invited_by:
      type: string
      format: uuid
      description: FK to `organizer_profiles.id`. The organizer who created the assignment.
      example: 11111111-1111-1111-1111-111111111111
    status:
      $ref: './Enums.yaml#/CheckinAssignmentStatus'
    created_at:
      type: string
      format: date-time
      example: '2026-12-10T08:00:00+08:00'
    updated_at:
      type: string
      format: date-time
      example: '2026-12-10T08:00:00+08:00'

CheckInAssignmentCreate:
  type: object
  description: Request body for an organizer adding a check-in staff member to an event.
  required: [event_id, staff_email]
  properties:
    event_id:
      type: string
      format: uuid
      example: 55555555-5555-5555-5555-555555555555
    staff_email:
      type: string
      format: email
      example: staff@example.com

CheckInAssignmentUpdate:
  type: object
  description: >
    Fields an organizer may update on a check-in assignment.
    Currently only `status` to revoke access (`status = revoked`).
  required: [status]
  properties:
    status:
      $ref: './Enums.yaml#/CheckinAssignmentStatus'
