EmailLog:
  type: object
  description: >
    Record of every transactional email dispatched through Resend.
    Written by Edge Functions under service role only — no client INSERT.
    Rows are write-once: no UPDATE or DELETE is permitted.
  example:
    id: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
    event_id: null
    invitation_id: null
    attendee_id: null
    recipient_email: organizer@example.com
    type: organizer_account_verified
    provider_message_id: resend_msg_org_verified_123456789
    status: sent
    sent_at: '2026-12-01T09:15:30+08:00'
    created_at: '2026-12-01T09:15:00+08:00'
  required: [id, recipient_email, type, status, created_at]
  properties:
    id:
      type: string
      format: uuid
      example: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
    event_id:
      type: ['string', 'null']
      format: uuid
      description: FK to `events.id`. `null` for org-wide/admin-facing emails.
      example: 55555555-5555-5555-5555-555555555555
    invitation_id:
      type: ['string', 'null']
      format: uuid
      description: FK to `invitations.id`. Enables per-invitation email history.
      example: 66666666-6666-6666-6666-666666666666
    attendee_id:
      type: ['string', 'null']
      format: uuid
      description: FK to `attendees.id`. Set for attendee-specific emails.
      example: null
    recipient_email:
      type: string
      format: email
      example: guest@example.com
    type:
      type: string
      description: >
        Email type identifier. New values can be added without a database
        migration because the underlying column is freeform text.
      enum:
        - invitation_sent
        - rsvp_confirmation
        - waitlist_promoted
        - reminder
        - invitation_nudge
        - attendee_status_update
        - headcount_request_submitted
        - headcount_request_decided
        - qr_codes_issued
        - invitation_design_validation_failed
        - organizer_account_verified
      example: organizer_account_verified
    provider_message_id:
      type: ['string', 'null']
      description: Resend's message ID, useful for delivery troubleshooting.
      example: null
    status:
      $ref: './Enums.yaml#/EmailLogStatus'
    sent_at:
      type: ['string', 'null']
      format: date-time
      description: Set when `status` transitions to `sent`.
      example: null
    created_at:
      type: string
      format: date-time
      example: '2026-12-01T09:15:00+08:00'
