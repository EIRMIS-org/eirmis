QrBundleRequest:
  type: object
  description: >
    Request body for the `dispatchQrBundle` Edge Function. The function
    generates a multi-page PDF (one QR code + attendee name per page) for the
    specified invitation and emails it to the guest's address via Resend.
    `RESEND_API_KEY` is an Edge Function secret — never exposed to the client.
  required: [invitation_id]
  properties:
    invitation_id:
      type: string
      format: uuid
      description: Invitation whose QR bundle should be emailed.
      example: 66666666-6666-6666-6666-666666666666

QrBundleResponse:
  type: object
  description: Response from the `dispatchQrBundle` Edge Function.
  required: [message, emails_sent]
  properties:
    message:
      type: string
      description: Success message confirming the QR bundle was sent.
      example: QR bundle sent successfully.
    emails_sent:
      type: integer
      description: Number of QR bundle emails successfully sent.
      example: 1
