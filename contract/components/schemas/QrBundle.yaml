QrBundleRequest:
  type: object
  description: >
    Request body for the `dispatchQrBundle` Edge Function. Provide exactly one of
    `invitation_id` to send a bundle for one invitation, or `event_id` to send
    bundles for all confirmed invitations at an event. Each PDF contains one QR
    code and attendee name per page and is emailed via Resend. `RESEND_API_KEY`
    is an Edge Function secret — never exposed to the client.
  additionalProperties: false
  oneOf:
    - required: [invitation_id]
    - required: [event_id]
  properties:
    invitation_id:
      type: string
      format: uuid
      description: Target a single invitation.
      example: 66666666-6666-6666-6666-666666666666
    event_id:
      type: string
      format: uuid
      description: Target all confirmed invitations for an event.
      example: 55555555-5555-5555-5555-555555555555

QrBundleResponse:
  type: object
  description: Response from the `dispatchQrBundle` Edge Function.
  oneOf:
    - type: object
      additionalProperties: false
      required: [message, emails_sent]
      properties:
        message:
          type: string
          description: Success message confirming the QR bundle was sent.
          example: QR bundle sent successfully.
        emails_sent:
          type: integer
          description: Number of QR bundle emails successfully sent.
          example: 1
    - type: object
      additionalProperties: false
      required: [dispatched_count]
      properties:
        dispatched_count:
          type: integer
          description: Number of QR bundle emails successfully dispatched.
          example: 1
        invitation_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of invitations whose QR bundles were sent.
          example:
            - 66666666-6666-6666-6666-666666666666
