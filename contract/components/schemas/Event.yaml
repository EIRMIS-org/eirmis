      example: Grand Ballroom
    address:
      type: ['string', 'null']
      example: 123 Rizal Avenue
    city:
      type: ['string', 'null']
      example: Cebu City
    location_url:
      type: ['string', 'null']
      example: null
    capacity:
      type: integer
      minimum: 1
      example: 500
    rsvp_deadline:
      type: string
