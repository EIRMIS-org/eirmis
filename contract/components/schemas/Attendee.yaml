
Attendee:
  type: object
  description: >
    One row per person in an invitation's party — the invited guest themselves
    plus any additional members they submit. The primary attendee (`is_primary = true`)
    is auto-created when the invitation is accepted.
  example:
    id: 77777777-7777-7777-7777-777777777777
    invitation_id: 66666666-6666-6666-6666-666666666666
    full_name: Maria Santos
    email: maria.santos@example.com
    is_primary: true
    status: approved
    submitted_at: '2026-10-05T14:00:00+08:00'
    reviewed_by: 11111111-1111-1111-1111-111111111111
    reviewed_at: '2026-10-06T09:00:00+08:00'
    review_reason: Primary guest approved
    qr_token: 'signed-qr-token-sample'
    checked_in: false
    checked_in_at: null
    checked_in_by: null
    is_walk_in: false
  required:
    - id
    - invitation_id
    - full_name
    - is_primary
    - status
    - submitted_at
    - checked_in
    - is_walk_in
  properties:
    id:
      type: string
      format: uuid
      example: 77777777-7777-7777-7777-777777777777
    invitation_id:
      type: string
      format: uuid
      example: 66666666-6666-6666-6666-666666666666
    full_name:
      type: string
      example: Maria Santos
    email:
      type: ['string', 'null']
      description: >
        Optional. NOT UNIQUE — the same email may appear on multiple Attendee rows
        (e.g. children without their own address, or colleagues sharing contact info).
        An Attendee may have no email at all.
      example: maria.santos@example.com
    is_primary:
      type: boolean
      description: >
        `true` only for the auto-created record representing the inviting guest.
        Set by a DB trigger on invitation acceptance; clients may not set this to `true`.
      example: false
    status:
      $ref: './Enums.yaml#/AttendeeStatus'
    submitted_at:
      type: string
      format: date-time
      example: '2026-10-05T14:00:00+08:00'
    reviewed_by:
      type: ['string', 'null']
      format: uuid
      description: FK to `organizer_profiles.id`. Set by the `decideAttendee` Edge Function.
      example: null
    reviewed_at:
      type: ['string', 'null']
      format: date-time
      example: null
    review_reason:
      type: ['string', 'null']
      description: Organizer's optional note on the approval or rejection decision.
      example: null
    qr_token:
      type: ['string', 'null']
      description: >
        Signed unique token issued by the `decideAttendee` Edge Function when
        `status` becomes `approved`. Never generated client-side. `null` until approved.
      example: null
    checked_in:
      type: boolean
      description: Whether this attendee has been scanned in.
      example: false
    checked_in_at:
      type: ['string', 'null']
      format: date-time
      example: null
    checked_in_by:
      type: ['string', 'null']
      format: uuid
      description: >
        FK to `auth.users.id`. Set by the `scanCheckIn` Edge Function. Identifies
        the organizer or staff member who performed the scan.
      example: null
    is_walk_in:
      type: boolean
      description: >
        `true` for attendees created on event day with no prior roster entry.
        Walk-ins are created by the check-in operator, not by the guest portal.
      example: false

AttendeeCreate:
  type: object
  description: >
    Request body for a guest submitting an additional (non-primary) attendee
    for their accepted invitation.
  example:
    invitation_id: 66666666-6666-6666-6666-666666666666
    full_name: Jose Santos
    email: jose.santos@example.com
  required: [invitation_id, full_name]
  properties:
    invitation_id:
      type: string
      format: uuid
      description: UUID of the accepted invitation this attendee belongs to.
      example: 66666666-6666-6666-6666-666666666666
    full_name:
      type: string
      description: Full name of the attendee to be printed on badge and check-in roster.
      example: Jose Santos
    email:
      type: ['string', 'null']
      description: Optional contact email address for the attendee.
      example: jose.santos@example.com

AttendeeUpdate:
  type: object
  description: >
    Fields a guest may update on a rejected (non-primary) attendee to resubmit it.
    Resubmission sets the attendee back to `pending`.
  example:
    full_name: Jose Antonio Santos
    email: jose@example.com
  minProperties: 1
  properties:
    full_name:
      type: string
      description: Updated full name of the attendee.
      example: Jose Antonio Santos
    email:
      type: ['string', 'null']
      description: Updated optional email address for the attendee.
      example: jose@example.com

AttendeeDecisionRequest:
  type: object
  description: >
    Request body for the `decideAttendee` Edge Function.
    Approve or reject an individual attendee. Approval performs an atomic
    event-capacity check. If approval would exceed capacity, the organizer
    must explicitly set `override_capacity` to true and provide a non-empty
    reason. A capacity override is only valid for an approval. The Edge
    Function validates these conditional requirements before invoking
    the transactional database operation.
  example:
    decision: approve
    override_capacity: false
    reason: null
  required: [decision]
  properties:
    decision:
      type: string
      enum: [approve, reject]
      description: Organizer's decision to approve or reject this attendee registration.
      example: approve
    override_capacity:
      type: boolean
      default: false
      description: >
        Explicitly authorizes approval beyond event capacity. Defaults to false.
        Cannot be true when decision is reject.
      example: false
    reason:
      type: ['string', 'null']
      description: >
        Organizer's optional decision note. A non-empty reason is mandatory
        whenever override_capacity is true. Stored in review_reason and audit_log_entries.
      example: null

AttendeeDecisionResponse:
  type: object
  description: >
    Response from the `decideAttendee` Edge Function. Includes the updated
    attendee state. If the decision used an explicit over-capacity override,
    `capacity_warning` is true and the override is recorded in `audit_log_entries`.
  example:
    attendee:
      id: 77777777-7777-7777-7777-777777777777
      invitation_id: 66666666-6666-6666-6666-666666666666
      full_name: Maria Santos
      email: maria.santos@example.com
      is_primary: true
      status: approved
      submitted_at: '2026-10-05T14:00:00+08:00'
      reviewed_by: 11111111-1111-1111-1111-111111111111
      reviewed_at: '2026-10-06T09:00:00+08:00'
      review_reason: Primary guest approved
      qr_token: 'signed-qr-token-sample'
      checked_in: false
      checked_in_at: null
      checked_in_by: null
      is_walk_in: false
    capacity_warning: false
  required: [attendee, capacity_warning]
  properties:
    attendee:
      $ref: '#/Attendee'
    capacity_warning:
      type: boolean
      description: >
        `true` when an approval used the explicit override because it would
        cause the event's approved-attendee count to exceed `events.capacity`.
        The override is recorded in `audit_log_entries`.
      example: false
