SelectParam:
  name: select
  in: query
  schema:
    type: string
  description: >
    PostgREST column selection. Comma-separated column names.
    Use `related_table(col1,col2)` for embedded resource selection.
  example: 'id,title,status'

LimitParam:
  name: limit
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 1000
  description: Maximum number of rows to return.
  example: 20

OffsetParam:
  name: offset
  in: query
  schema:
    type: integer
    minimum: 0
  description: Number of rows to skip before returning results.
  example: 0

OrderParam:
  name: order
  in: query
  schema:
    type: string
  description: >
    PostgREST ordering. Format: `column.direction[.nullsfirst|nullslast]`.
  example: 'created_at.desc'

PreferCountParam:
  name: Prefer
  in: header
  schema:
    type: string
    enum:
      - count=exact
      - count=planned
      - count=estimated
  description: >
    Request a row count. `count=exact` returns the precise count in the
    `Content-Range` response header.
  example: count=exact

LogFeedPreferParam:
  name: Prefer
  in: header
  schema:
    type: string
  description: >
    Comma-separated preferences for log feed reads. PostgREST supports
    `count=exact`, `count=planned`, or `count=estimated` for Content-Range totals.
    Prism additionally accepts `example=<response-example-name>` for deterministic
    mock selection; this does not imply live filtering or pagination behavior.
  example: count=exact

PreferReturnParam:
  name: Prefer
  in: header
  schema:
    type: string
    enum:
      - return=representation
      - return=minimal
      - return=headers-only
  description: >
    Control whether mutated row(s) are returned in the response body.
    `return=representation` returns the full row.
  example: return=representation

IdFilterParam:
  name: id
  in: query
  required: true
  schema:
    type: string
    pattern: '^eq\.[0-9a-fA-F-]{36}$'
  description: >
    PostgREST row filter selecting the single row to mutate, in the form
    `eq.<uuid>`. PostgREST does not route `/<table>/{id}`; rows are always
    targeted by a query filter. Required so a PATCH/DELETE can never run
    unfiltered against the whole table.
  example: eq.55555555-5555-5555-5555-555555555555
