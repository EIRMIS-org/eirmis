openapi: 3.1.0

info:
  title: EIRMIS API
  version: 0.1.0
  license:
    name: All Rights Reserved
    url: 'https://github.com/EIRMIS-org/eirmis/blob/main/LICENSE.md'
  description: |

    **Event Invitation and RSVP Management Information System (EIRMIS)**

    This contract is the single source of truth for every HTTP operation the
    React SPA may call against the Supabase backend (PostgREST + Edge Functions).
    It is authored and reviewed like code — a contract change requires approval
    from both the frontend and backend sides.

    ## Two Backend Surfaces

    1. **PostgREST data endpoints** (`/rest/v1/<table>`) — curated read and
       simple-write operations the app is entitled to make. Authorization is RLS,
       not client-side discipline.
    2. **Edge Function endpoints** (`/functions/v1/<name>`) — anything that needs
       a secret, a privileged write, or a multi-step transaction.

    ## What is NOT in this contract

    - **Supabase Realtime** — the attendance dashboard WebSocket channel is
      managed through `supabase-js` directly and documented in the README §9.
    - **Supabase Storage signed-URL reads** — gallery image and HTML invitation
      URLs are obtained via `supabase-js` Storage API, not HTTP operations.
    - **Supabase Auth endpoints** — magic-link, Google OAuth, and session
      management are handled by `supabase-js` Auth API.

    ## Auth

    All operations require a Supabase JWT (`bearerAuth`) unless explicitly
    overridden with `security: []`. The two genuinely public operations
    (open-registration event lookup and guest upsert) are the only ones that
    may opt out of authentication.

    ## Error Model

    A single `Error` schema — `{ code, message, details, hint }` — matching
    PostgREST's native error shape. Edge Functions must return this exact shape
    and the same HTTP status codes so `src/lib/api` has exactly one error path.

    ## PostgREST Query Parameter Conventions

    PostgREST uses a specific query syntax. Key patterns:
    - **Filtering**: `?col=eq.value`, `?col=in.(a,b)`, `?col=is.null`
    - **Column selection**: `?select=col1,col2,related_table(col3)`
    - **Ordering**: `?order=col.asc`, `?order=col.desc`
    - **Pagination**: `?limit=20&offset=0`
    - **Row count**: send `Prefer: count=exact` header; result in `Content-Range`
    - **Return body**: send `Prefer: return=representation` on POST/PATCH
    - **Upsert**: send `Prefer: resolution=merge-duplicates` on POST with a conflict column

servers:
  - url: 'https://{project}.supabase.co'
    description: Supabase hosted project
    variables:
      project:
        description: Your Supabase project reference (e.g. `abcdefghijklmnop`)
        default: your-project-ref

security:
  - bearerAuth: []

tags:
  - name: 'Organizer — Events'
    description: Event creation and management.
  - name: 'Organizer — Guests'
    description: Guest list viewing and management.
  - name: 'Organizer — Invitations'
    description: Invitation creation and management.
  - name: 'Organizer — Approvals'
    description: Attendee and headcount request approval queues.
  - name: 'Organizer — Design'
    description: Invitation design upload and gallery management.
  - name: 'Organizer — Check-in Staff'
    description: Check-in staff assignment management.
  - name: 'Organizer — Reminders'
    description: Scheduled reminder configuration.
  - name: 'Organizer — QR Codes'
    description: QR code generation and bulk dispatch.
  - name: 'Organizer — Waitlist'
    description: Waitlist promotion controls.
  - name: 'Organizer — Email History'
    description: Transactional email log.
  - name: 'Organizer — Audit'
    description: Audit log access.
  - name: 'Organizer — Profile'
    description: Organizer profile management.
  - name: 'Admin — Profile'
    description: Admin profile read.
  - name: 'Admin — Organizer Verification'
    description: Organizer verification queue (pending → active).
  - name: 'Guest — Profile'
    description: Guest profile read and update.
  - name: 'Guest — Attendees'
    description: Attendee roster submission and edit.
  - name: 'Guest — Headcount'
    description: Headcount increase request submission.
  - name: 'Check-in Staff — Event'
    description: Scoped event read for the assigned event.
  - name: 'Check-in Staff — Scan'
    description: QR token scan and check-in recording.
  - name: 'Public — Registration'
    description: Unauthenticated open-registration flow (no bearerAuth required).
  - name: 'Internal — System'
    description: >
      Service-role or scheduled-job operations. Not reachable from the SPA.
      Documented for completeness and CI drift detection.

