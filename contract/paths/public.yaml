# =============================================================================
# Public — unauthenticated paths (security: [])
#
# These are the only operations in the contract that opt out of the global
# bearerAuth requirement. They serve the /register/:slug open-registration flow.
#
# NOTE: The public registration submission creates both a Guest row and an
# Invitation row. This is currently two PostgREST calls (guest upsert + invitation
# create). If atomicity + email dispatch in one step becomes a requirement, this
# should be promoted to a dedicated Edge Function. See implementation_plan.md.
# =============================================================================

/rest/v1/events/public:
  get:
    operationId: getPublicEvent
    summary: Look up an open-registration event by slug
    description: >
      Returns a published, non-deleted `open_registration` event matching the
      given slug. Used to populate the public `/register/:slug` page before
      any authentication. RLS permits `anon` reads for matching events.
    tags: [Public — Registration]
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/SelectParam'
      - name: slug
        in: query
        required: true
        schema:
          type: string
          example: eq.annual-gala-2026
      - name: visibility_mode
        in: query
        schema:
          type: string
          example: eq.open_registration
      - name: status
        in: query
        schema:
          type: string
          example: eq.published
    responses:
      '200':
        description: The matching event (empty array if not found or not accessible).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/Event.yaml#/Event'
              maxItems: 1
      '400':
        $ref: '../components/responses.yaml#/BadRequest'

/rest/v1/guests/register:
  post:
    operationId: registerGuest
    summary: Create or match a guest for open-registration
    description: >
      Creates a new guest record, or matches an existing one by email, as part
      of the public `/register/:slug` submission flow. Use
      `Prefer: resolution=merge-duplicates` to upsert on email conflict.
      Returns the created or matched guest row with `Prefer: return=representation`.
      The caller then uses the returned `id` to create the invitation.
    tags: [Public — Registration]
    security: []
    parameters:
      - $ref: '../components/parameters.yaml#/PreferReturnParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Guest.yaml#/GuestCreate'
          examples:
            OpenRegistration:
              summary: Public self-registration submission
              value:
                email: newguest@example.com
                full_name: Juan dela Cruz
    responses:
      '201':
        description: Guest created or matched.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Guest.yaml#/Guest'
            examples:
              RegisteredGuest:
                summary: Guest record returned
                value:
                  id: 33333333-3333-3333-3333-333333333333
                  email: newguest@example.com
                  full_name: Juan dela Cruz
                  auth_user_id: null
                  created_at: '2026-10-01T09:00:00+08:00'
                  updated_at: '2026-10-01T09:00:00+08:00'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
