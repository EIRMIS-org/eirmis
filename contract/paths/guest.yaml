# =============================================================================
# Guest Portal — PostgREST paths
#
# Paths exclusive to, or primarily used by, the Guest role.
#
# Shared paths documented in organizer.yaml with Guest operations:
#   - GET  /rest/v1/invitations?guest_id=eq.{guestId}&select=*,events(*)
#          (operationId: listInvitations, guest lists own invitations with event details)
#   - PATCH /rest/v1/invitations/{id}
#          (operationId: updateInvitation, guest updates status, dietary_preference, special_requests)
#   - POST /rest/v1/attendees
#          (operationId: submitAttendee, guest adds party members up to max_party_size)
#   - POST /functions/v1/submit-headcount-request
#          (operationId: submitHeadcountRequest, inserts request and emails organizer)
# =============================================================================

/rest/v1/guests/{id}:
  patch:
    operationId: updateGuestProfile
    summary: Update own guest profile
    description: >
      A guest may update their own `full_name`. RLS restricts the update
      to `auth_user_id = auth.uid()`.
    tags: [Guest — Profile]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: eq.33333333-3333-3333-3333-333333333333
      - $ref: '../components/parameters.yaml#/PreferReturnParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Guest.yaml#/GuestUpdate'
    responses:
      '204':
        description: Updated.
      '200':
        description: "Updated guest profile (when `Prefer: return=representation`)."
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Guest.yaml#/Guest'
            example:
              id: 33333333-3333-3333-3333-333333333333
              email: guest@example.com
              full_name: Maria Santos
              auth_user_id: 33333333-3333-3333-3333-333333333333
              created_at: '2026-09-05T08:00:00+08:00'
              updated_at: '2026-09-05T08:00:00+08:00'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
