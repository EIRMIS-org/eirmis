# =============================================================================
# Guest Portal — PostgREST paths
#
# Paths exclusive to, or primarily used by, the Guest role.
#
# Shared paths documented in organizer.yaml with Guest operations:
#   - GET  /rest/v1/invitations?guest_id=eq.{guestId}&select=*,events(*)
#          (operationId: listInvitations, guest lists own invitations with event details)
#   - PATCH /rest/v1/invitations?id=eq.{id}
#          (operationId: updateInvitation, guest updates status, dietary_preference, special_requests)
#   - POST /rest/v1/attendees
#          (operationId: submitAttendee, guest adds party members up to max_party_size)
#   - POST /functions/v1/submit-headcount-request
#          (operationId: submitHeadcountRequest, inserts request and emails organizer)
#   - PATCH /rest/v1/guests?id=eq.{id}
#          (operationId: updateGuestProfile, guest updates own full_name)
#
# PostgREST has no `/<table>/{id}` route, so guest mutations live on the
# collection paths in organizer.yaml. This file currently defines no paths.
# =============================================================================

