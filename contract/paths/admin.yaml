# =============================================================================
# Admin Portal — PostgREST paths
# Admins manage organizer verification and org-wide settings only.
# They have no access to individual event guest lists, RSVP content,
# or attendee data — that exclusion is enforced by RLS on all other tables.
# =============================================================================

/rest/v1/admin_profiles:
  get:
    operationId: getAdminProfile
    summary: Read own admin profile
    description: Returns the authenticated admin's own profile row.
    tags: [Admin — Profile]
    parameters:
      - $ref: '../components/parameters.yaml#/SelectParam'
      - name: id
        in: query
        schema:
          type: string
          example: eq.22222222-2222-2222-2222-222222222222
    responses:
      '200':
        description: Admin profile.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/AdminProfile.yaml#/AdminProfile'
              maxItems: 1
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

