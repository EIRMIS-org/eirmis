# =============================================================================
# Admin Portal — PostgREST paths
# Admins manage organizer verification and org-wide settings only.
# They have no access to individual event guest lists, RSVP content,
# or attendee data — that exclusion is enforced by RLS on all other tables.
# =============================================================================

/rest/v1/admin_profiles:
  get:
    operationId: getAdminProfile
    summary: Read own admin profile
    description: Returns the authenticated admin's own profile row.
    tags: [Admin — Profile]
    parameters:
      - $ref: '../components/parameters.yaml#/SelectParam'
      - name: id
        in: query
        schema:
          type: string
          example: eq.22222222-2222-2222-2222-222222222222
    responses:
      '200':
        description: Admin profile.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/AdminProfile.yaml#/AdminProfile'
              maxItems: 1
            example:
              - id: 22222222-2222-2222-2222-222222222222
                email: admin@example.com
                full_name: System Administrator
                created_at: '2026-09-01T08:00:00+08:00'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

/rest/v1/org_settings:
  get:
    operationId: getOrgSettings
    summary: Read organization settings
    description: >
      Returns the organization-wide settings singleton.
      Restricted to system administrators by RLS.
    tags: [Admin — Settings]
    parameters:
      - $ref: '../components/parameters.yaml#/SelectParam'
    responses:
      '200':
        description: Organization settings singleton array.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/OrgSettings.yaml#/OrgSettings'
              maxItems: 1
            example:
              - id: 00000000-0000-0000-0000-000000000001
                org_name: EIRMIS Enterprise Cloud Platform
                default_timezone: Asia/Manila
                default_capacity_ceiling: 150
                sender_domain: invites.eirmis.org
                malware_sandbox_enabled: true
                self_registration_gate_enabled: true
                created_at: '2026-09-01T08:00:00+08:00'
                updated_at: '2026-09-10T12:30:00+08:00'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

/rest/v1/org_settings/{id}:
  patch:
    operationId: updateOrgSettings
    summary: Update organization settings
    description: >
      Updates one or more fields on the organization settings singleton.
      Restricted to system administrators by RLS.
    tags: [Admin — Settings]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-000000000001
      - $ref: '../components/parameters.yaml#/PreferReturnParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/OrgSettings.yaml#/OrgSettingsUpdate'
    responses:
      '204':
        description: Settings updated successfully.
      '200':
        description: "Updated settings record (when `Prefer: return=representation`)."
        content:
          application/json:
            schema:
              $ref: '../components/schemas/OrgSettings.yaml#/OrgSettings'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
